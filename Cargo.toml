[package]
name = "ikigai-shacl"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
description = "SHACL validation for ikigai — urn:shacl:validate validates an RDF data graph against a shapes graph (rudof's shacl crate); the validation report is itself an RDF graph. Native, or a lazy-loadable WASM module with the `module` feature; shacl-engine (JavaScript) is held to the same parity corpus."
repository = "https://github.com/ikigai-rs/ikigai-shacl"
homepage = "https://github.com/ikigai-rs/ikigai-shacl"
keywords = ["ikigai", "roc", "shacl", "rdf", "validation"]
categories = ["web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.1.34 is the floor this crate's manifold needs: `ArgSpec::one_of` and
# `ArgSpec::default_value` landed there (core #55, "ActionSpec: the (endpoint, verb)
# pair becomes the unit of selection"), and `as` declares both. `ArgSpec::class`
# predates it (0.1.32) and `ContentId::of` is older still (<= 0.1.21).
ikigai-core = "0.1.34"
# rudof's consolidated SHACL crate (NOT the split shacl_validation/shacl_ast, which are
# mid-rename and don't compose). In-memory (no rocksdb).
#
# ⚠ THE UPPER BOUNDS ARE LOAD-BEARING, AND A CARET CANNOT REPLACE THEM. The rudof 0.3
# line makes BREAKING API changes inside PATCH releases: 0.3.17 added a third argument
# (`config: &ShaclConfig`) to `ShaclProcessor::validate`. Under Cargo's 0.x rules
# `^0.3.8` already means `>=0.3.8, <0.4.0`, so `shacl = "0.3"` admitted that break and
# ikigai-shacl 0.1.0 as published stopped compiling for anyone resolving fresh. Only a
# real upper bound excludes an untested patch release. (Nothing here caught it: CI had
# not run in 67 days. The clock that fixes that is `upstream-watch.yml` in
# ikigai-devtools — the one repo whose cron GitHub cannot auto-disable for inactivity,
# because every dispatch writes to it. It clones this repo and runs the same steps.)
#
# Each rudof crate requires its own siblings at `^<its own version>`, so all three move in
# lockstep; keep the three ranges identical. Raising them is a deliberate act, not a chore:
# the `upstream-latest` job in ikigai-devtools' `.github/workflows/upstream-watch.yml` is
# what says whether the next release still compiles against this call site.
#
# 0.3.22 is the FLOOR because it is the first release whose validator builds for wasm:
# 0.3.18 gated `shacl::validator` (and `sparql_service::RdfData`) behind
# `cfg(not(target_family = "wasm"))`, so the `module` feature below could not build for the
# target it exists for. 0.3.22 removed that gate and moved `RdfData` / `DataValidation` behind
# a default-on `sparql` feature, which the default features here keep on. The ceiling is the
# newest release tested (0.3.24, 2026-10-04): both ends were resolved from scratch, built
# native and wasm, and tested, with no change to this crate's code.
#
# There is no longer a direct `prefixmap` constraint. It existed because prefixmap 0.3.22
# removed a method rudof_rdf 0.3.18 calls; rudof_rdf 0.3.22+ requires `prefixmap ^0.3.22`
# itself, so the trap cannot be reached from inside these bounds. ⚠ The general trap is still
# open one crate out: rudof's OTHER transitive crates resolve to the newest 0.3.x, so a sibling
# release that breaks the rudof_rdf/shacl we bound to is a fresh-resolve break with nothing of
# ours changed. The bounds stop a break in these three crates, not in theirs.
shacl = ">=0.3.22, <0.3.25"
sparql_service = ">=0.3.22, <0.3.25"  # RdfData — the in-memory RDF data graph
rudof_rdf = ">=0.3.22, <0.3.25"       # RDFFormat / ReaderMode / OxigraphInMemory / BuildRDF
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
# `limits::check_sparql` and `limits::on_sparql_stack`: the bound on caller SPARQL (a shapes
# graph's `sh:select`) and the sized stack validation runs on (ledger #963). 0.2.7 is where
# `limits` landed; 0.2.8 is the floor because it is the release the bound was verified
# against here. Default features OFF: `persistent` (RocksDB) stays out, so this adds only the
# store crate and a `toml` 0.8 family to the graph (oxigraph and spargebra are rudof's already),
# and it builds for wasm, where `on_sparql_stack` runs inline. ⚠ It also lifts the graph's
# effective `ikigai-core` floor to 0.1.57, the store's; the 0.1.34 above is still the API this
# crate's own code uses. ⚠ `^0.2.8` is a CEILING too (<0.3.0). ★ Temporary home: ledger #976
# folds the four copies of `limits.rs` into one shared crate, and this line moves to it.
ikigai-store = { version = "0.2.8", default-features = false }

# The `module` feature turns this library into a standalone lazy-loadable WASM module via
# `ikigai_module::wasm_module!`. CI checks it both ways, so neither half can rot unseen again:
#
# - NATIVE `--features module`: CI's `features: module` input lints and tests it. (It rotted
#   once: the old `0.1.6` pin resolved to 0.1.10, which builds core's `Resolved` by struct
#   literal and has not compiled against a fresh core since 0.1.78. Nothing noticed, because
#   no job enabled the feature.)
# - WASM `--features module --target wasm32-unknown-unknown`: CI's `wasm-lib` input with
#   `wasm-features: module` runs clippy there. This has compiled only since the rudof floor
#   above moved to 0.3.22 (ledger #206); before that it failed to resolve the validator
#   imports and never built. ⚠ Clippy is a type-check: it does not link the cdylib, and
#   nothing here LOADS the module in a wasm runtime, so what the rudof stack does at runtime
#   in a browser (rayon, getrandom, the `sparql` feature's reqwest/tokio) is untested until a
#   host loads it.
[dependencies.ikigai-module]
# 0.3.1 is the floor that builds against ikigai-core >= 0.1.78 (`Resolved` gained a private
# field, so it can only be built through `Resolved::new`): 0.1.10, 0.2.0 and 0.3.0 all build it
# by struct literal, and a fresh resolve (newest core under the caret above) fails to compile
# them. ⚠ A `^0.3.1` pin is also a CEILING (<0.4.0). The library uses only `wasm_module!`,
# which is unchanged across 0.1 → 0.3 (no `ModuleSpace`, so no `ModuleFloor` to choose).
version = "0.3.1"
optional = true
[dependencies.wasm-bindgen]
version = "=0.2.108"
optional = true
[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true
[dependencies.js-sys]
version = "0.3"
optional = true
[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[features]
# cargo build --release --lib --features module --target wasm32-unknown-unknown
module = [
    "dep:ikigai-module",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:console_error_panic_hook",
]

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (tests/conformance.rs). ⚠ It requires
# `ikigai-core >= 0.1.67`, and cargo unifies core across the graph, so the DEV build
# always links 0.1.67+ — the declared 0.1.34 floor above is the library's true
# minimum API and is never exercised here. (conformance PENDING #126/#137/#144.)
ikigai-conformance = "0.2.0"
