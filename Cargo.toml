[package]
name = "ikigai-shacl"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
description = "SHACL validation for ikigai — urn:shacl:validate validates an RDF data graph against a shapes graph (rudof's shacl crate by default, or a subset validator with no network stack when the `rudof` feature is off); the validation report is itself an RDF graph. Native, or a lazy-loadable WASM module with the `module` feature; shacl-engine (JavaScript) is held to the same parity corpus."
repository = "https://github.com/ikigai-rs/ikigai-shacl"
homepage = "https://github.com/ikigai-rs/ikigai-shacl"
keywords = ["ikigai", "roc", "shacl", "rdf", "validation"]
categories = ["web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.2.0 is the streams release (ledger #2261), and the pin: the old "0.1.89" meant <0.2.0
# under 0.x rules, so moving onto it is a deliberate breaking change, not a resolve. Every
# ikigai crate linked here (dev ones included) is on core 0.2.x, so the graph links ONE core.
# ⚠ `^0.2.0` is a CEILING too (<0.3.0).
#
# Before it, 0.1.89 was the floor: `space_iri` (a configuration-free space names itself
# `urn:iki:space:shacl`, ledger #987), and the release where a later `bind` drops a space's
# name, which is what makes naming `space()` safe for a host that extends it. (The older
# floors it subsumes: `ArgSpec::one_of`/`default_value` at 0.1.34, `ArgSpec::class` at
# 0.1.32.) All of them are in 0.2.0.
ikigai-core = "0.2.0"
# Shared lenient Turtle nesting scan and bound, first exported in 0.2.1 (0.2.0
# has neither). RDF 1.2 stays controlled by rudof; this dependency enables no features.
# 0.3.0 is the release on ikigai-core 0.2.0 (ledger #2261); 0.2.x links core 0.1.
# ⚠ `^0.3.0` is a CEILING (<0.4.0).
ikigai-rdf = "0.3.0"
# rudof's consolidated SHACL crate (NOT the split shacl_validation/shacl_ast, which are
# mid-rename and don't compose). In-memory (no rocksdb).
#
# ⚠ THE UPPER BOUNDS ARE LOAD-BEARING, AND A CARET CANNOT REPLACE THEM. The rudof 0.3
# line makes BREAKING API changes inside PATCH releases: 0.3.17 added a third argument
# (`config: &ShaclConfig`) to `ShaclProcessor::validate`. Under Cargo's 0.x rules
# `^0.3.8` already means `>=0.3.8, <0.4.0`, so `shacl = "0.3"` admitted that break and
# ikigai-shacl 0.1.0 as published stopped compiling for anyone resolving fresh. Only a
# real upper bound excludes an untested patch release. (Nothing here caught it: CI had
# not run in 67 days. The clock that fixes that is `upstream-watch.yml` in
# ikigai-devtools — the one repo whose cron GitHub cannot auto-disable for inactivity,
# because every dispatch writes to it. It clones this repo and runs the same steps.)
#
# Each rudof crate requires its own siblings at `^<its own version>`, so all three move in
# lockstep; keep the three ranges identical. Raising them is a deliberate act, not a chore:
# the `upstream-latest` job in ikigai-devtools' `.github/workflows/upstream-watch.yml` is
# what says whether the next release still compiles against this call site.
#
# 0.3.22 is the FLOOR because it is the first release whose validator builds for wasm:
# 0.3.18 gated `shacl::validator` (and `sparql_service::RdfData`) behind
# `cfg(not(target_family = "wasm"))`, so the `module` feature below could not build for the
# target it exists for. 0.3.22 removed that gate and moved `RdfData` / `DataValidation` behind
# a default-on `sparql` feature, which the default features here keep on. The ceiling is the
# newest release tested (0.3.24, 2026-10-04): both ends were resolved from scratch, built
# native and wasm, and tested, with no change to this crate's code.
#
# There is no longer a direct `prefixmap` constraint. It existed because prefixmap 0.3.22
# removed a method rudof_rdf 0.3.18 calls; rudof_rdf 0.3.22+ requires `prefixmap ^0.3.22`
# itself, so the trap cannot be reached from inside these bounds. ⚠ The general trap is still
# open one crate out: rudof's OTHER transitive crates resolve to the newest 0.3.x, so a sibling
# release that breaks the rudof_rdf/shacl we bound to is a fresh-resolve break with nothing of
# ours changed. The bounds stop a break in these three crates, not in theirs.
#
# ★ All three are OPTIONAL, behind the `rudof` feature (on by default; ledger #1176). rudof cannot
# be built without a network stack on native: `rudof_iri` depends on reqwest non-optionally, and
# `rudof_rdf`'s native target forces oxigraph's `http-client` and tokio. A host that turns
# `rudof` off still serves `urn:shacl:validate`, from the subset validator in `src/core_shacl.rs`.
shacl = { version = ">=0.3.22, <0.3.25", optional = true }
sparql_service = { version = ">=0.3.22, <0.3.25", optional = true }  # RdfData — the in-memory RDF data graph
rudof_rdf = { version = ">=0.3.22, <0.3.25", optional = true }       # RDFFormat / ReaderMode / OxigraphInMemory / BuildRDF
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
# `limits::check_sparql` and `limits::on_sparql_stack`: the bound on caller SPARQL (a shapes
# graph's `sh:select`) and the sized stack validation runs on (ledger #963); and
# `service::has_service`, the walk that finds a `SERVICE` anywhere in a parsed query
# (ledger #1099). 0.2.11 is the floor: `service::has_service` and `SERVICE_REFUSAL`, the shared
# consumer wording this crate's refusal now carries after its own first sentence (ledger #1108),
# landed there (`service` itself at 0.2.10, `limits::sparql_stack_size` earlier). Default features OFF:
# `persistent` (RocksDB) stays out, so this adds only the store crate and a `toml` 0.8 family
# to the graph (oxigraph and spargebra are rudof's already), and it builds for wasm, where
# `on_sparql_stack` runs inline. (Its own `ikigai-core` floor, 0.1.57, sits below ours.)
# ★ Temporary home: ledger #976 folds the four copies of
# `limits.rs` into one shared crate, and this line moves to it.
#
# `budget::EvaluationBudget`, the TIME budget both validators run under, and
# `budget::check_query`, the algebra bound the subset validator applies before planning, landed
# in 0.2.18 (ledger #1327, #1176). 0.2.21 was the floor next, for BEHAVIOR rather than API (ledger
# #1735): it is the release where a budget reserves a slot for each evaluation IN FLIGHT
# (ledger #1427). Before it the cap was checked only against the overdue count, so any number of
# validations arriving together all started, and all could outlive their callers. rudof cannot
# be stopped partway, so that cap is the only bound on the cores abandoned rudof validations
# hold. 0.2.18 and 0.2.19 (there is no 0.2.20) have every API used here and do not keep that
# promise: `tests/rudof_time_budget.rs` sends one validation more than the cap and needs it
# refused, and against 0.2.19 all of them start (measured 2026-10-16).
#
# 0.2.24 is the floor now (ledger #1002): `TimeBudget::with_reserve` and
# `TimeBudget::with_caller_share` landed there, with the default reserve and per-caller share
# that, left at their defaults, gave one caller ONE of this crate's two slots, so one runaway
# refused that caller's every later validation (`core_shacl::caller_share` states ours; ledger
# #1500, #1510). The #1427 behavior above is kept.
#
# 0.3.0 is the pin now: the release on ikigai-core 0.2.0 (ledger #2261); every 0.2.x links
# core 0.1. Everything above is in it. ⚠ `^0.3.0` is a CEILING too (<0.4.0).
#
# ★ OPTIONAL since 0.4.0, behind the `sparql` feature (ledger #2107): only `sh:select` and the
# rudof path use it. A core-only build (`default-features = false`) links none of it.
ikigai-store = { version = "0.3.0", default-features = false, optional = true }
# The pool rudof's validator runs in (`on_rudof_pool`, ledger #1102): rudof splits a level of two
# or more shapes with `par_iter_mut`, which runs on the global pool's 2 MiB workers unless it is
# called from inside a pool of ours. ⚠ That only holds if this is the SAME rayon-core rudof's
# `par_iter_mut` resolves, which a `1.x` caret guarantees (one semver-compatible rayon-core per
# graph). 1.7 is rudof's own floor, so this adds nothing to the graph; `ThreadPoolBuilder`'s
# `num_threads`/`stack_size`/`thread_name` and `install` are far older. Only rudof needs it, so it
# is optional with rudof.
rayon = { version = "1.7", optional = true }
# The parser for the queries rudof will run, so `service::has_service` can walk them. It must
# be the spargebra oxigraph parses with (0.4.x for oxigraph 0.5), which a caret unifies with on
# its own; 0.4.7 is ikigai-store's floor. ⚠ `^0.4.7` is a CEILING too (<0.5.0).
# Optional with `sparql`, like the store.
spargebra = { version = "0.4.7", optional = true }
# The term types rudof's `RdfData` stores (`RdfData::Term` IS `oxrdf::Term`), matched directly
# so every IRI, including a literal's datatype and the parts of a triple term, is checked before
# rudof renders a focus node into SPARQL (ledger #1099). Floor and features are rudof_rdf's own
# (0.3.3, `rdf-12`), so this adds nothing to the graph. ⚠ `^0.3.3` is a CEILING too (<0.4.0).
#
# ⚠ `rdf-12` comes in only with `rudof` (ledger #1176): oxrdf's `Term::Triple` exists only under
# that feature, and oxttl, spargebra and sparesults each match on it exhaustively under their OWN
# `rdf-12`. Turning it on for oxrdf alone, in a build where nothing turns it on for them, makes
# all three fail to compile (E0004). rudof turns all of them on; the subset build turns none.
oxrdf = "0.3.3"
# The subset validator's own stack (`src/core_shacl.rs`). The CORE half (every constraint but
# `sh:sparql`) needs only `oxrdf`, `oxttl`, `oxsdatatypes` and `regex`, which is what a build with
# default features off links (ledger #2107):
#
# - `oxttl`: Turtle in (the data and shapes graphs) and out (the report), for the core build
#   and every other. The parser and serializer oxigraph's `io` wraps for Turtle, so the bytes are
#   the same. Each 0.2.x pins one oxrdf exactly, and 0.2.3 is the one that pins `=0.3.3`, the
#   oxrdf floor above. ⚠ `^0.2.3` is a CEILING too (<0.3.0).
# - `oxigraph` (optional, `sparql`): the in-memory `Store` each `sh:select` is evaluated over,
#   through `ikigai_store::service::evaluator()` (which refuses every `SERVICE`), and the
#   rudof path's Turtle parser. Default features OFF, as the store takes it, so no RocksDB and no
#   `http-client`. 0.5.1 is the store's own floor, and `substitute_variable` and
#   `with_cancellation_token` are both there. ⚠ `^0.5.1` is a CEILING too (<0.6.0).
# - `oxsdatatypes`: the XSD value spaces `sh:datatype` checks a literal's lexical form against
#   and `sh:minInclusive` and its siblings compare in. spareval pins it exactly, and a caret here
#   unifies with that pin. ⚠ `^0.2.2` is a CEILING too (<0.3.0).
# - `regex`: `sh:pattern`, the engine spareval's `REGEX` uses. ⚠ `^1.7` is a CEILING (<2.0.0).
#   Default features OFF, keeping `std` and `unicode` (XPath patterns are Unicode-aware, so
#   `\w` and the case-insensitive flag must be too): the `perf-*` features (the lazy DFA, the
#   one-pass and backtracking engines, aho-corasick literal search) are a third of the core-only
#   wasm, measured 2026-10-22 (1.89 → 1.43 MB raw, ledger #2107). Matching stays linear time on
#   the PikeVM. A build with `sparql` gets them back through spareval's default-feature `regex`,
#   so only the core-only build matches more slowly, and its work bound charges a match by the
#   bytes it reads.
oxttl = "0.2.3"
oxigraph = { version = "0.5.1", default-features = false, optional = true }
oxsdatatypes = "0.2.2"
regex = { version = "1.7", default-features = false, features = ["std", "unicode"] }

# The `module` feature turns this library into a standalone lazy-loadable WASM module via
# `ikigai_module::wasm_module!`. CI checks it both ways, so neither half can rot unseen again:
#
# - NATIVE `--features module`: CI's `features: module` input lints and tests it. (It rotted
#   once: the old `0.1.6` pin resolved to 0.1.10, which builds core's `Resolved` by struct
#   literal and has not compiled against a fresh core since 0.1.78. Nothing noticed, because
#   no job enabled the feature.)
# - WASM `--features module --target wasm32-unknown-unknown`: CI's `wasm-lib` input with
#   `wasm-features: module` runs clippy there. This has compiled only since the rudof floor
#   above moved to 0.3.22 (ledger #206); before that it failed to resolve the validator
#   imports and never built. ⚠ Clippy is a type-check: it does not link the cdylib, and
#   nothing here LOADS the module in a wasm runtime, so what the rudof stack does at runtime
#   in a browser (rayon, getrandom, the `sparql` feature's reqwest/tokio) is untested until a
#   host loads it.
[dependencies.ikigai-module]
# 0.3.1 is the floor that builds against ikigai-core >= 0.1.78 (`Resolved` gained a private
# field, so it can only be built through `Resolved::new`): 0.1.10, 0.2.0 and 0.3.0 all build it
# by struct literal, and a fresh resolve (newest core under the caret above) fails to compile
# them. The library uses only `wasm_module!`,
# which is unchanged across 0.1 → 0.3 (no `ModuleSpace`, so no `ModuleFloor` to choose).
# 0.5.0 is the pin now: the release on ikigai-core 0.2.0 (ledger #2261); 0.3.x links core 0.1.
# ⚠ `^0.5.0` is a CEILING (<0.6.0).
version = "0.5.0"
optional = true
[dependencies.wasm-bindgen]
# EXACT on purpose (ledger #1342, after #1193), unlike every other pin here. The `module`
# feature is built with THIS crate as the root package and post-processed by a `wasm-bindgen`
# CLI: ikigai-web-demo's `.github/workflows/pages.yml` checks this repo out at SHACL_REV,
# builds it with no lock (`Cargo.lock` is gitignored here), and runs `wasm-bindgen-cli@0.2.108`
# over `ikigai_shacl.wasm`. The CLI refuses a wasm whose library carries a different bindgen
# SCHEMA_VERSION (0.2.108's is 0.2.107; 0.2.128 and 0.2.129 carry 0.2.128), and under a caret
# the fresh resolve takes the newest 0.2.x. So this pin is the only thing tying the two
# together: bump it in step with that CLI pin (and the other `=0.2.108` crates beside it, which
# the same page builds with the same CLI), never alone. It costs native consumers nothing: the
# dependency is optional and only `module` enables it.
version = "=0.2.108"
optional = true
[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true
[dependencies.js-sys]
version = "0.3"
optional = true
[dependencies.console_error_panic_hook]
version = "0.1"
optional = true
[dependencies.futures]
# Only for the `module` feature: `ikigai_module::wasm_module!` expands to
# `::futures::channel::oneshot`, so the crate that invokes the macro must name `futures` itself
# (ikigai-module's own docs list it). The library code never uses it; as a normal dependency it
# was the only thing the subset build linked beyond `ikigai-store` (ledger #1396).
version = "0.3"
optional = true

[features]
# Three builds, each a superset of the one before (ledger #1176, #2107):
#
# - `default-features = false`: the subset validator's CORE constraints alone, on oxrdf, oxttl,
#   oxsdatatypes and regex. No SPARQL engine, no store, no rudof, no network stack, and so small
#   enough for an in-page wasm kernel. A shapes graph that uses `sh:sparql` or `sh:select` is
#   REFUSED, naming the construct and the feature that enables it, never skipped.
# - `sparql`: adds the subset's `sh:sparql` / `sh:select` constraints, evaluated over oxigraph's
#   in-memory store behind ikigai-store's guards and time budget. This is what
#   `default-features = false` gave through 0.3.x.
# - `rudof` (the default): rudof's validator, which serves the endpoint when compiled. It implies
#   `sparql`, since its path uses the same guards and budget. Consumers that take the defaults
#   keep exactly what they had.
default = ["rudof"]
sparql = ["dep:ikigai-store", "dep:spargebra", "dep:oxigraph"]
rudof = ["sparql", "dep:shacl", "dep:sparql_service", "dep:rudof_rdf", "dep:rayon", "oxrdf/rdf-12", "oxttl/rdf-12"]
# cargo build --release --lib --features module --target wasm32-unknown-unknown
# The module is the rudof build, unchanged: it implies `rudof`.
module = [
    "rudof",
    "dep:ikigai-module",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:console_error_panic_hook",
    "dep:futures",
]

[dev-dependencies]
# `executor::block_on`, which the integration tests drive the kernel with, in every feature
# combination (the normal dependency above is `module`-only).
futures = "0.3"
# The module recipe as one test (tests/conformance.rs). 0.9.0 added core 0.1.105's contract-shape
# checks (REQUIRED probes input groups, OUTPUTS honors output_from, PIPELINE's named-only line,
# VALIDATE refuses a default on a binding) and RECOMPUTE; 0.10.0 adds FAILURES, OFF unless a suite
# opts in. 0.11.0 is the release on ikigai-core 0.2.0 (ledger #2261) and turns two checks on by
# default: DATATYPES (a literal for an ik: property is tagged with its rdfs:range) and FAILURES
# (judging only actions that state failure classes), so the report skips nothing.
# REQUIRED (0.8.0), VALIDATE (0.7.0) and SPACE-NAME (0.6.0) are older. ⚠ `^0.11.0` is a CEILING
# (<0.12.0): this pin sat at "0.2.0" while the suite grew through 0.3 to 0.6, then at "0.6.0"
# through 0.7 and 0.8, and at "0.8.0" past 0.9, and the test kept reporting green against the old
# definition of "done". Raise it deliberately when the suite moves.
ikigai-conformance = "0.11.0"
# The shapes the plan doors validate against, which `tests/differential.rs` runs both validators
# over (ledger #1176). 0.1.108 is the floor because the plan corpus names the shapes that
# `SHAPES` reports from (tests/plans/*.ttl `# expect:`), and by 0.1.108 a step's binds / mapOver /
# forkOf / order shapes are the shared `urn:ikigai:shape:stage:*` (they were `step:*` at 0.1.103).
# 0.2.0 is the pin now: the streams release (ledger #2261), on ikigai-core 0.2.0; the old
# "0.1.108" meant <0.2.0 under 0.x rules. Conformance 0.11.0 resolves vocab 0.2.x whatever this
# says. ⚠ `^0.2.0` is a CEILING too (<0.3.0).
ikigai-vocab = "0.2.0"
