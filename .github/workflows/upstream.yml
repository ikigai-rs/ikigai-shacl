# Upstream watch — the gate that ci.yml structurally cannot be.
#
# WHY THIS EXISTS. rudof's `shacl` 0.3.17 added a third argument to
# `ShaclProcessor::validate` — in a PATCH release. `ikigai-shacl` 0.1.0 published
# `shacl = "0.3"`, and under Cargo's 0.x rules that caret admits 0.3.17, so the
# published crate stopped compiling for everyone who is not us. Nothing went red.
#
# ⚠ AND THE REASON IS NOT THE ONE YOU EXPECT. This repo does not commit Cargo.lock
# (see .gitignore), so `ci.yml` already resolves the whole graph fresh on every run —
# it WOULD have caught this. What it cannot do is run when nothing happens: the last
# CI run here was 2026-06-29, shacl 0.3.17 landed 2026-09-04, and the break was found
# on 2026-09-06 by a `cargo install` on a laptop. The missing ingredient was a CLOCK,
# not a fresh resolve.
#
# So: same family as `required-features` hiding a target from `--all-targets` and
# `cargo install` ignoring the lock — a gate that silently covers less than it looks
# like it does — but the hole here is WHEN it runs, not WHAT it builds. A sibling repo
# that DOES commit its lockfile has the other half of the problem and needs both jobs
# below for different reasons.
#
# WHY IT IS A SEPARATE WORKFLOW, NOT A JOB IN ci.yml. These jobs are *allowed to go
# red* — `upstream-latest` going red is the whole point, it is how we learn upstream
# broke again. A red check on a pull request either blocks the merge or teaches
# everyone to merge past red checks; both are worse than the disease. So this never
# runs on `pull_request`, and nothing gates on it.
#
# ⚠ Known limits, stated so nobody reads more assurance into this than it carries:
#   - GitHub disables scheduled workflows after 60 days with no repo activity. On a
#     quiet repo the cron stops and nothing says so — which is precisely the state
#     this repo was in. `push: main` is a backstop, and a quiet repo defeats that too.
#   - `upstream-latest` watches the three rudof crates BY NAME. A patch-release break
#     in any other dependency is caught only once it is inside our declared bounds.
#   - Nothing here proves the *published* ikigai-shacl builds; it proves this tree's
#     requirements do. Those diverge the moment Cargo.toml changes without a release.
name: Upstream watch

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # What a stranger actually gets: our declared requirements, resolved against the
  # registry as it is right now. Identical in content to ci.yml's job (no committed
  # lockfile here), and deliberately duplicated rather than folded in — this one is on
  # a timer and is allowed to go red. If this is red, `cargo add ikigai-shacl` is
  # broken for everyone. The explicit `rm -f Cargo.lock` is belt-and-braces: it keeps
  # the job honest if the lockfile ever starts being committed.
  fresh-resolve:
    name: fresh resolve (what a consumer gets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Discard the lockfile
        run: rm -f Cargo.lock
      - name: Resolve fresh
        run: cargo generate-lockfile
      - name: What resolved
        run: cargo tree --depth 1
      - name: Test
        run: cargo test

  # The early warning. Forces the newest published rudof crates regardless of the
  # upper bounds in Cargo.toml, so we find out that upstream broke the API *before*
  # anyone raises those bounds. Red here means: do not widen the pins yet, and the
  # call site needs work. Green here means the bounds can be raised deliberately.
  upstream-latest:
    name: upstream latest (early warning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Newest published rudof versions
        id: latest
        run: |
          set -euo pipefail
          for c in shacl sparql_service rudof_rdf; do
            # crates.io sparse index: /<first two>/<next two>/<name> for names >= 4 chars.
            url="https://index.crates.io/${c:0:2}/${c:2:2}/${c}"
            v="$(curl -sSf "$url" | jq -rs 'map(select(.yanked | not)) | last | .vers')"
            [ -n "$v" ] && [ "$v" != "null" ] || { echo "could not read latest $c" >&2; exit 1; }
            echo "$c is at $v"
            echo "$c=$v" >> "$GITHUB_OUTPUT"
          done
      - name: Force those exact versions
        run: |
          set -euo pipefail
          cargo add \
            "shacl@=${{ steps.latest.outputs.shacl }}" \
            "sparql_service@=${{ steps.latest.outputs.sparql_service }}" \
            "rudof_rdf@=${{ steps.latest.outputs.rudof_rdf }}"
          rm -f Cargo.lock
          cargo generate-lockfile
      # Self-check: `cargo add` quietly doing something other than what we asked would
      # leave this job testing the versions we already test — a gate that runs and
      # covers nothing. Assert the lock really holds the newest before trusting a pass.
      - name: Assert the lock holds the newest
        run: |
          set -euo pipefail
          check() {
            got="$(cargo metadata --format-version 1 \
                   | jq -r --arg n "$1" '.packages[] | select(.name == $n) | .version' | head -1)"
            [ "$got" = "$2" ] || { echo "$1: lock has $got, newest is $2" >&2; exit 1; }
            echo "$1 = $got (newest)"
          }
          check shacl "${{ steps.latest.outputs.shacl }}"
          check sparql_service "${{ steps.latest.outputs.sparql_service }}"
          check rudof_rdf "${{ steps.latest.outputs.rudof_rdf }}"
      - name: Test against the newest upstream
        run: cargo test

  # The browser half of the parity contract has the identical exposure: `npm ci`
  # replays package-lock.json, so a shacl-engine release that changed behavior would
  # never reach us. Informational — a red here means the parity claim needs re-checking
  # against a current shacl-engine, not that anything shipped is broken.
  js-latest:
    name: shacl-engine latest (early warning)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js-parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install newest (ignore the lockfile)
        run: |
          rm -f package-lock.json
          npm install
      - run: npm ls --depth=0 || true
      - run: npm test
