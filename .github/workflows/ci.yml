name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    # `module` NATIVELY only: its optional deps rotted unseen for weeks because no job enabled
    # the feature (ledger #728). No `wasm-lib`/`wasm-features: module` — that build fails
    # inside the current rudof bounds for an upstream reason; see the note in Cargo.toml.
    with:
      features: module

  # The other half of the parity contract: shacl-engine (the browser validator) must produce
  # the same outcome as rudof for every case in tests/corpus/ — both assert the same
  # expected.json. See js-parity/parity.test.mjs.
  js-parity:
    name: shacl-engine parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js-parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js-parity/package-lock.json
      - run: npm ci
      - run: npm test
