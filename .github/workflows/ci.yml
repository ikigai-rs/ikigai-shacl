name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    # `module` both ways, tested natively and linted on wasm32: its optional deps rotted unseen
    # for weeks because no job enabled the feature (ledger #728), and its WASM build, the one
    # it exists for, has only been possible since the rudof floor moved to 0.3.22 (ledger
    # #206; see the note in Cargo.toml).
    #
    # The core-only build: `default-features = false`, the subset validator's core constraints
    # with no SPARQL (ledger #1176, #2107), what an in-page wasm kernel links. `no-default-features`
    # lints, tests and documents it, and lints its wasm32 lib (without `wasm-features`), so the
    # wasm build of the light validator is checked on every change. The forbid list checks it
    # stays free of rudof, the network stack and the async runtime, and, since 0.4.0, of the
    # SPARQL stack the `sparql` feature adds: oxigraph, its store and evaluator, and
    # ikigai-store. `oxhttp` stands for oxigraph's `http-client` feature, which is exactly
    # `["oxhttp"]` in every oxigraph 0.5.x. The `futures` facade is `module`-only (ledger #1396).
    #
    # ⚠ The middle build, `default-features = false, features = ["sparql"]` (what ikigai-gonk's
    # plan doors need), has no job of its own: rust.yml can add a feature set to the defaults but
    # cannot combine one with `--no-default-features`. Its code is the subset with SPARQL, which
    # every default-feature job compiles and tests (`rudof` implies `sparql`, and
    # `core_shacl::validate_report` is the subset in every build); what only it does is serve the
    # endpoint from the subset with SPARQL and leave oxrdf's `rdf-12` off.
    with:
      features: module
      wasm-lib: true
      wasm-features: module
      no-default-features: true
      no-default-features-forbid: "reqwest hyper tokio rustls oxhttp rayon shacl sparql_service rudof_* futures oxigraph ikigai-store spareval spargebra sparopt sparesults oxrocksdb-sys"

  # The other half of the parity contract: shacl-engine (the browser validator) must produce
  # the same outcome as rudof for every case in tests/corpus/ — both assert the same
  # expected.json. See js-parity/parity.test.mjs.
  js-parity:
    name: shacl-engine parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js-parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js-parity/package-lock.json
      # `npm ci` warns that sparqljs 3.7.4 is deprecated. Kept on purpose: upstream archived it for
      # Traqula and no supported release exists; it arrives only through componentsjs 6.4.0 (the
      # latest), whose `rdf-parse ^4` brings sparqlalgebrajs, and this job never loads it (ledger #1346).
      - run: npm ci
      - run: npm test
