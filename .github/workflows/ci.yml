name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    # `module` both ways, tested natively and linted on wasm32: its optional deps rotted unseen
    # for weeks because no job enabled the feature (ledger #728), and its WASM build, the one
    # it exists for, has only been possible since the rudof floor moved to 0.3.22 (ledger
    # #206; see the note in Cargo.toml).
    with:
      features: module
      wasm-lib: true
      wasm-features: module

  # The subset build: `default-features = false`, what a host without rudof links (ledger #1176).
  # The shared gates build the default features only, and rust.yml's `features` input can add
  # features but cannot turn the default off, so without this job nothing would lint, test or
  # document the subset validator as such a host builds it, nor check that it stays free of the
  # network stack it exists to avoid.
  subset:
    name: subset validator (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --no-default-features
      - run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
      # The point of the feature: no rudof, no HTTP client, no async runtime. A positive check
      # (the tree must print, and must not name them), so a failing `cargo tree` cannot read as
      # "absent"; and oxigraph's `http-client` feature must be off. The `futures` facade is
      # `module`-only (ledger #1396): without it the subset links exactly `ikigai-store`'s graph.
      - name: the subset build links no rudof and no network stack
        run: |
          tree=$(cargo tree --no-default-features -e normal --prefix none)
          grep -q '^ikigai-shacl ' <<<"$tree"
          if grep -E '^(reqwest|hyper|tokio|rustls|oxhttp|rayon|shacl|sparql_service|rudof_[a-z_]+) ' <<<"$tree"; then
            echo "::error::the --no-default-features graph links rudof or a network stack"
            exit 1
          fi
          if grep -E '^futures ' <<<"$tree"; then
            echo "::error::the --no-default-features graph links the futures facade, which only the module feature needs"
            exit 1
          fi
          features=$(cargo tree --no-default-features -e features -i oxigraph)
          grep -q '^oxigraph ' <<<"$features"
          if grep -q 'http-client' <<<"$features"; then
            echo "::error::the --no-default-features graph turns on oxigraph's http-client"
            exit 1
          fi

  # The other half of the parity contract: shacl-engine (the browser validator) must produce
  # the same outcome as rudof for every case in tests/corpus/ — both assert the same
  # expected.json. See js-parity/parity.test.mjs.
  js-parity:
    name: shacl-engine parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js-parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js-parity/package-lock.json
      # `npm ci` warns that sparqljs 3.7.4 is deprecated. Kept on purpose: upstream archived it for
      # Traqula and no supported release exists; it arrives only through componentsjs 6.4.0 (the
      # latest), whose `rdf-parse ^4` brings sparqlalgebrajs, and this job never loads it (ledger #1346).
      - run: npm ci
      - run: npm test
